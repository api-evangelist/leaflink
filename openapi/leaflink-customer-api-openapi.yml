openapi: 3.2.0
info:
  title: LeafLink Customer API
  version: '2022-10-31'
  description: 'This reference specification outlines all the available HTTP operations of the LeafLink API.


    See the [LeafLink Developer Hub](/api) for guides, how-to, and general information of the API.

    '
  termsOfService: https://www.leaflink.com/terms-and-conditions/
  contact:
    email: support@leaflink.com
servers:
- url: https://api.leaflink.com
  description: LeafLink API production URL.
- url: https://staging-api.leaflink.com
  description: LeafLink API staging URL.
security:
- bearerAuth: []
tags:
- name: Customer
paths:
  /customer_statuses:
    get:
      operationId: customer_statuses_list
      description: List multiple Company Customer Status.
      summary: List Company Customer Status
      parameters:
      - in: query
        name: company_slug
        schema:
          type: string
      - in: query
        name: description
        schema:
          type: string
      - in: query
        name: hex_color
        schema:
          type: string
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: is_stock
        schema:
          type: boolean
      - in: query
        name: order
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: owner
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      - name: LeafLink-Version
        description: '[API version docs](/api/getting-started/#versioning)'
        required: false
        in: header
        schema:
          type: string
          format: date
      tags:
      - Customer
      security:
      - bearerAuth: []
      responses:
        '200':
          description: A list of serialized Company Customer Status
          headers:
            RateLimit-Limit:
              schema:
                type: integer
              description: The requests quota in the time window.
            RateLimit-Remaining:
              schema:
                type: integer
              description: The remaining requests quota in the current window.
            RateLimit-Reset:
              schema:
                type: integer
              description: The time remaining in the current window, specified in seconds.
            RateLimit-Policy:
              schema:
                type: string
              description: The quota policy information.
        '429':
          description: Rate Limit Error
          headers:
            Retry-After:
              schema:
                type: integer
              description: The time remaining before the rejected request can be tried again, specified in seconds.
  /customer_statuses/{id}:
    get:
      operationId: customer_statuses_retrieve
      description: Get a single Company Customer Status.
      summary: Get Company Customer Status
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this company customer status.
        required: true
      - name: LeafLink-Version
        description: '[API version docs](/api/getting-started/#versioning)'
        required: false
        in: header
        schema:
          type: string
          format: date
      tags:
      - Customer
      security:
      - bearerAuth: []
      responses:
        '200':
          description: A serialized Company Customer Status
          headers:
            RateLimit-Limit:
              schema:
                type: integer
              description: The requests quota in the time window.
            RateLimit-Remaining:
              schema:
                type: integer
              description: The remaining requests quota in the current window.
            RateLimit-Reset:
              schema:
                type: integer
              description: The time remaining in the current window, specified in seconds.
            RateLimit-Policy:
              schema:
                type: string
              description: The quota policy information.
        '429':
          description: Rate Limit Error
          headers:
            Retry-After:
              schema:
                type: integer
              description: The time remaining before the rejected request can be tried again, specified in seconds.
  /customers:
    get:
      operationId: customers_list
      description: List multiple Customers.
      summary: List Customers
      parameters:
      - in: query
        name: address
        schema:
          type: string
      - in: query
        name: address__in
        schema:
          type: string
      - in: query
        name: address__startswith
        schema:
          type: string
      - in: query
        name: archived
        schema:
          type: boolean
      - in: query
        name: brand
        schema:
          type: string
      - in: query
        name: brand__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: brand__startswith
        schema:
          type: string
      - in: query
        name: business_identifier
        schema:
          type: string
      - in: query
        name: business_identifier__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: business_identifier__startswith
        schema:
          type: string
      - in: query
        name: business_license_name
        schema:
          type: string
      - in: query
        name: business_license_name__in
        schema:
          type: string
      - in: query
        name: business_license_name__startswith
        schema:
          type: string
      - in: query
        name: company_slug
        schema:
          type: string
      - in: query
        name: created_on__gt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on__lt
        schema:
          type: string
          format: date-time
      - in: query
        name: created_on__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: dba
        schema:
          type: string
      - in: query
        name: dba__in
        schema:
          type: string
      - in: query
        name: dba__startswith
        schema:
          type: string
      - in: query
        name: delinquent
