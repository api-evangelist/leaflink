          type: string
      - in: query
        name: name__startswith
        schema:
          type: string
      - in: query
        name: next_contact_date__gt
        schema:
          type: string
          format: date
      - in: query
        name: next_contact_date__gte
        schema:
          type: string
          format: date
      - in: query
        name: next_contact_date__lt
