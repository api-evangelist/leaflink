components:
  schemas:
    ProductSubcategoryResponse:
      type: object
      properties:
        id:
          type: integer
          description: Unique id generated by LeafLink.
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        category:
          type: integer
          description: The id for the category this subcategory belongs to.  See `id` in the product-categories response.
    BuyerLicense:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        type:
          type: string
        classification:
          type: string
    ProductCategoryResponse:
      type: object
      properties:
        id:
          type: integer
          description: Unique id generated by LeafLink.
        name:
          type: string
        slug:
          type: string
        description:
          type: string
    OrderAddress:
      type: object
      title: Delivery Address
      description: Read only delivery address as provided during order creation.
      readOnly: true
      properties:
        address:
          title: Address
          type: string
        unit_number:
          title: Unit Number
          type: string
        city:
          title: City
          type: string
        state:
          title: State
          description: State abbreviation
          type: string
        zipcode:
          title: Zip Code
          type: string
    BuyerOrderResponse:
      type: object
      properties:
        id:
          format: uuid
          description: Unique id generated by LeafLink
          type: string
        short_id:
          description: The _Order No._ displayed in the user interface
          type: string
        status:
          description: Order status
          type: string
          enum:
          - Draft
          - Submitted
          - Accepted
          - Backorder
          - Fulfilled
          - Shipped
          - Complete
          - Rejected
          - Combined
          - Cancelled
        type:
          description: License type for the order
          type: string
        buyer:
          type: object
          description: Company on the buy side of the order
          properties:
            id:
              type: string
            name:
              type: string
            address:
              type: string
            unit_number:
              type: string
            city:
              type: string
            state:
              type: string
            zip:
              type: string
            email:
              type: string
            phone:
              type: string
            licenses:
              type: array
              items:
                $ref: '#/components/schemas/BuyerLicense'
        seller:
          type: object
          description: Company on the sell side of the order
          properties:
            id:
              type: string
            name:
              type: string
            address:
              type: string
            unit_number:
              type: string
            city:
              type: string
            state:
              type: string
            zip:
              type: string
            phone:
              type: string
            licenses:
              type: array
              items:
                $ref: '#/components/schemas/BuyerLicense'
        source:
          description: Describes whether this was a buyer or seller generated order `"BGO"` `"SGO"`
          type: string
        created_by:
          description: User who created the order.  If BGO, full staff member details.  If SGO, the staff member's name.
          type: object
          properties:
            id:
              type: string
              description: null if SGO
            name:
              type: string
            username:
              type: string
              description: null if SGO
            email:
              type: string
              description: null if SGO
        created_on:
          description: Date and time that the order was created
          type: string
          format: date-time
        last_edited_on:
          description: Date and time that the order was last edited
          type: string
          format: date-time
        currency:
          description: Currency used in the order
          type: string
        line_items:
          type: array
          items:
            type: object
            properties:
              product:
                type: object
                properties:
                  id:
                    type: string
                  sku:
                    type: string
                  name:
                    type: string
                  brand:
                    type: objet
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                  unit_of_measure:
                    type: string
                  unit_denomination:
                    type: string
                  base_unit_of_measure:
                    type: string
                  base_units_per_unit:
                    type: integer
                  sold_in_multiples:
                    type: boolean
                  units_per_case:
                    type: integer
                  category:
                    $ref: '#/components/schemas/ProductCategoryResponse'
                  sub_category:
                    $ref: '#/components/schemas/ProductSubcategoryResponse'
              quantity:
                type: integer
              sold_by:
                type: string
              price:
                type: number
              total:
                type: number
        subtotal:
          type: number
        shipping_charge:
          type: number
        discount:
          type: number
        tax:
          type: number
        total:
          type: number
        payable_to:
          type: object
          properties:
            name:
              type: string
            address:
              type: string
            city:
              type: string
            state:
              type: string
            zip:
              type: string
        payment_term:
          $ref: '#/components/parameters/PaymentTerm'
        payment_methods:
          $ref: '#/components/parameters/PaymentMethods'
        payment_due_date:
          description: Date the payment is due
          type: string
          format: date
        ship_date:
          description: Date and time the order was shipped
          type: string
          format: date-time
        shipping_details:
          type: string
          description: Shipping notes added by the seller
        is_delivered:
          type: boolean
        delivered_date:
          type: string
          description: Date and time the order was delivered
        notes:
          type: string
          description: Additional notes added by the seller
        sales_reps:
          description: Names of the sales reps assigned to the order
          type: array
          items:
            type: string
        delivery_address:
          $ref: '#/components/schemas/OrderAddress'
      example:
        id: d8240c79-7c90-4177-8c46-919b5577a4c0
        short_id: 5577a4c0
        status: Shipped
        type: Adult Use
        buyer:
