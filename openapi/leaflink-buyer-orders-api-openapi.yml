        currency: USD
        line_items:
        - product:
            id: 237808
            sku: 3bb8021c3a214690f0e9
            name: Cartridge - Blueberry
            brand:
              id: 312
              name: Premium Cartridges
            unit_of_measure: Unit
            unit_denomination: One
            base_unit_of_measure: Gram
            base_units_per_unit: null
            sold_in_multiples: true
            units_per_case: 10
            category:
              id: 1
              name: Cartridges
              slug: cartridge
              description: Cartridge
            sub_category:
              id: 10
              name: Disposable
              slug: disposable
              description: Disposable
              category: 1
          quantity: 1
          sold_by: Case
          price: 220
          total: 220
        - product:
            id: 357811
            sku: 14632acc1f10568a0dec
            name: Cartridge - Strawberry
            brand:
              id: 312
              name: Premium Cartridges
            unit_of_measure: Unit
            unit_denomination: One
            base_unit_of_measure: Gram
