components:
  schemas:
    Company-unified-upstream-marketplace:
      type: object
      description: API v2 serializer for the Company model.
      properties:
        address:
          type: string
        announcement:
          type:
          - string
          - 'null'
          description: Company Announcement
          maxLength: 2000
        apply_ancillary_tax:
          type: boolean
          readOnly: true
        apply_arms_length_tax:
          type: boolean
          readOnly: true
        batch_enabled:
          type: boolean
          readOnly: true
          default: true
        business_identifier:
          type:
          - string
          - 'null'
          title: Business Identifier / UBI
          description: Company identifier distinct from license numbers
          maxLength: 100
        business_license_name:
          type:
          - string
          - 'null'
          description: Business License Name
          maxLength: 400
        buyer:
          type: boolean
          title: Is a Buyer
          description: Company buys on LeafLink
        can_access_shop_brands:
          type: boolean
          readOnly: true
        city:
          type: string
        dba:
          type: string
          description: DBA of company
          maxLength: 400
        description:
          type: string
        has_accting:
          type: boolean
          title: Enable Accounting Service integration
          description: When true can access Accounting Services
        hide_attached_packages:
          type: boolean
          title: Hide attached packages?
          description: Hide seed to sale packages that are mapped to a LeafLink resource?
        id:
          type: integer
          readOnly: true
        image:
          type:
          - string
          - 'null'
          format: uri
        name:
          type: string
          description: Name of Company (Note this is not the same as Brand)
          maxLength: 400
        seller:
          type: boolean
          title: Is a Seller
          description: Company sells on LeafLink
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        state:
          type: string
        sts_enabled:
          type: boolean
        zipcode:
          type: string
        available_languages:
          type: array
          items: {}
        available_languages_translated:
          type: array
          items:
            type: array
            items:
              type: string
            minLength: 2
            maxLength: 2
          readOnly: true
        default_language:
          type: array
          items: {}
        default_language_translated:
          type: array
          items:
            type: string
          minLength: 2
          maxLength: 2
          readOnly: true
        enable_post:
          type: boolean
          title: Enable LL PoST
          description: Whether this company has opted in to Payment on Sell Through
        current_plan_id:
          type: string
          readOnly: true
        default_payment_on_sell_through_payment_term:
          $ref: '#/components/schemas/PaymentTerm'
        is_payment_on_sell_through_default:
          type: boolean
          title: Default Payment on Sell-Through
          description: Is Payment on Sellthrough the default payment method
        always_share_sell_through_data:
          type: boolean
          title: Global override for companies_buyersellerpreferences.sell_through_data_shared
          description: Enable sell-through data sharing for all sellers in a buyer's CRM
      required:
      - address
      - apply_ancillary_tax
      - apply_arms_length_tax
      - available_languages
      - available_languages_translated
      - batch_enabled
      - can_access_shop_brands
      - city
      - current_plan_id
      - dba
      - default_language
      - default_language_translated
      - default_payment_on_sell_through_payment_term
      - id
      - name
      - sts_enabled
      - zipcode
    Driver:
      type: object
      description: serializer for Driver Model.
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          title: First Name of Driver
          description: First Name
          maxLength: 100
        last_name:
          type: string
          description: Last Name of Driver
          maxLength: 100
        metrc_employee_id:
          type: string
          description: METRC Employee ID for Driver
          maxLength: 100
        license_number:
          type: string
          description: License Number of Driver
          maxLength: 15
        phone:
          type: string
          description: Phone Number of Driver
          maxLength: 15
        is_active:
          type: boolean
          title: Active
          description: Is an active driver?
        transport_company_id:
          type: integer
          description: Transport company driver is associated to.
          readOnly: true
      required:
      - first_name
      - id
      - last_name
      - license_number
      - metrc_employee_id
      - phone
      - transport_company_id
    PaginatedCompanyTransportPartnerList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/CompanyTransportPartner'
    Vehicle:
      type: object
      description: Internal serializer for Vehicle Model.
      properties:
        id:
          type: integer
          readOnly: true
        make:
          type:
          - string
          - 'null'
          title: Vehicle Make
          description: Vehicle Make
          maxLength: 255
        model_year:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: -2147483648
          description: Vehicle Model Year
        model_name:
          type:
          - string
          - 'null'
          description: Vehicle Model Name
          maxLength: 255
        license_number:
