components:
  schemas:
    UnifiedCustomerGroupStatusEnum:
      enum:
      - active
      - archived
      type: string
    UnifiedCustomerGroup:
      type: object
      description: Serializer for Customer Group.
      properties:
        id:
          type: integer
          readOnly: true
        created_date:
          type: string
          format: date-time
          readOnly: true
          description: Date and time the resource was created
        modified_date:
          type: string
          format: date-time
          readOnly: true
          description: Date and time of the last edit
        name:
          type: string
          description: Name of the Customer Group.
          maxLength: 256
        description:
          type:
          - string
          - 'null'
          description: Description of the Customer Group.
          maxLength: 512
        customers:
          type: array
          items:
            type: integer
          description: List of customer IDs associated with this customer group
        status:
          allOf:
          - $ref: '#/components/schemas/UnifiedCustomerGroupStatusEnum'
          description: Overall status of the company customer group.
      required:
      - created_date
      - id
      - modified_date
      - name
    UnifiedCustomerGroupRequest:
      type: object
      description: Serializer for Customer Group.
      properties:
        name:
          type: string
          minLength: 1
          description: Name of the Customer Group.
          maxLength: 256
        description:
          type:
          - string
          - 'null'
          description: Description of the Customer Group.
          maxLength: 512
        customers:
          type: array
          items:
            type: integer
          description: List of customer IDs associated with this customer group
        status:
          allOf:
          - $ref: '#/components/schemas/UnifiedCustomerGroupStatusEnum'
          description: Overall status of the company customer group.
      required:
      - name
    PaginatedUnifiedCustomerGroupList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/UnifiedCustomerGroup'
    PatchedUnifiedCustomerGroupRequest:
      type: object
      description: Serializer for Customer Group.
      properties:
        name:
          type: string
          minLength: 1
          description: Name of the Customer Group.
          maxLength: 256
        description:
          type:
          - string
          - 'null'
          description: Description of the Customer Group.
          maxLength: 512
        customers:
          type: array
          items:
            type: integer
          description: List of customer IDs associated with this customer group
        status:
          allOf:
          - $ref: '#/components/schemas/UnifiedCustomerGroupStatusEnum'
          description: Overall status of the company customer group.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Authentication is done via access tokens (JWTs). See the [API authentication doc](/api/getting-started/#authentication) for more information.

        '
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
