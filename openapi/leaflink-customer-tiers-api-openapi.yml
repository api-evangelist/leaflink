openapi: 3.2.0
info:
  title: LeafLink Marketplace V2 Customer Tiers API
  description: '# Introduction

    ## HTTP Request Notes

    All endpoints covered in this document are preceded by `https://{{domain}}/api/v2/` unless otherwise noted.


    Available domains


    - `app.leaflink.com` - production environment


    - `www.sandbox.leaflink.com` - sandbox environment


    - `www.leaflink-integrations.leaflink.com` - integrations sandbox environment


    [Learn more about sandbox environments](https://developer.leaflink.com/brands/api/authorization/#sandbox-environments)



    Request paths must end in a slash character (''/''). Those that do not will return a 400 (Bad Request) response.


    ## Dynamic Responses

    Some of our API endpoints support dynamic responses. These

    are responses that vary in content and/or object level payload size

    according to request path or query parameters.


    Available parameters are listed beneath endpoint definitions.

    '
  termsOfService: https://leaflink.com/terms-and-conditions/
  contact:
    email: support@leaflink.com
  version: ''
servers:
- url: https://app.leaflink.com/api/v2
security:
- Token: []
tags:
- description: The `CompanyCustomerTier` represents a set of read only objects depicting a customer's tier in relationship to a company.
  name: customer-tiers
paths:
  /customer-tiers/:
    parameters: []
    get:
      operationId: customer-tiers_list
      summary: List
      description: List all `CompanyCustomerTier` objects available for use.
      parameters:
      - name: limit
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        description: The initial index from which to return the results.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompanyCustomerTier'
      tags:
      - customer-tiers
  /customer-tiers/{id}/:
    parameters:
    - name: id
      in: path
      description: A unique integer value identifying this company customer tier.
      required: true
      schema:
        type: integer
    get:
      operationId: customer-tiers__read
      summary: Read
      description: Retrieve a `CompanyCustomerTier` by ID.
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyCustomerTier'
      tags:
      - customer-tiers
components:
  schemas:
    CompanyCustomerTier:
      required:
      - rank
      - sort
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        created_on:
          title: Created on
          type: string
          format: date-time
          readOnly: true
        modified:
          title: Modified
          type: string
          format: date-time
          readOnly: true
        rank:
          title: Classification
          description: Company Classification
          type: string
          maxLength: 40
          minLength: 1
        sort:
          title: Sort Order
          description: Sort order, lower is first.
          type: integer
          maximum: 2147483647
          minimum: 0
  securitySchemes:
    Token:
      description: 'You must authenticate your requests by including your API key in each request header as described below.


        Requests should include a header named `Authorization`, with the value `App {MY_API_KEY}`. Note the single space in the header value.


        Example: `Authorization: App MY_API_KEY`


        [Learn more about generating your key](https://developer.leaflink.com/brands/api/getting-started/)


        **Legacy API keys:** If you are not using an Application API key, your authorization header should include the string `Token` and access will be scoped to all companies under which the user exists as a companystaff.


        Example: `Authorization: Token MY_API_KEY`

        '
      in: header
      name: Authorization
      type: apiKey
