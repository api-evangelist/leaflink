components:
  schemas:
    UnifiedProductSpecificationItemRequest:
      type: object
      description: Serializer for a product data item.
      properties:
        id:
          type: integer
        decimal_value:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        max_decimal_value:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        text_value:
          type: string
          title: Text Value of Product Data
          description: Text value of product data
          maxLength: 300
        product_specification_id:
          type: integer
          writeOnly: true
          description: Product Specification ID for the product
        unit_id:
          type: integer
          writeOnly: true
          description: Product Dosage Unit ID for the product
      required:
      - product_specification_id
      - unit_id
    UnifiedSubProductMVP:
      type: object
      description: Unified Sub Product serializer.
      properties:
        id:
          type: integer
        created_date:
          type: string
          format: date-time
          readOnly: true
          description: Date and time the resource was created
        modified_date:
          type: string
          format: date-time
          readOnly: true
          description: Date and time of the last edit
        name:
          type: string
          title: Product
          description: Product Name
          maxLength: 400
        wholesale_price:
          type: object
          properties:
            amount:
              type: number
            currency:
              type: string
          description: Wholesale price displayed in the LeafLink marketplace
        retail_price:
          type: object
          properties:
            amount:
              type: number
            currency:
              type: string
          description: Retail price displayed in the LeafLink marketplace
        unit_denomination:
          allOf:
          - $ref: '#/components/schemas/UnifiedUnitDenomination'
          readOnly: true
          description: The of amount of individual products in one sale unit
        unit_of_measure:
          allOf:
          - $ref: '#/components/schemas/UnifiedUnitOfMeasure'
          readOnly: true
          description: Base unit of measure for this product
        base_units_per_unit:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,15})?$
          description: Number of base units in one unit of this product
      required:
      - created_date
      - modified_date
      - name
      - retail_price
      - unit_denomination
      - unit_of_measure
      - wholesale_price
    ProductThresholdActionEnum:
      enum:
      - default
      - backorder
      - unavailable
      - internal
      type: string
    UnifiedBrand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Brand Name
          description: Name of the Brand
          maxLength: 400
      required:
      - id
      - name
    PatchedUnifiedProductMVPRequest:
      type: object
      description: Unified Product serializer.
      properties:
        sku:
          type:
          - string
          - 'null'
          minLength: 1
          title: Customer SKU
          description: Stock Keeping Unit. A unique identifier for a Product, alternative to id.
          maxLength: 255
        seller_id:
          type: integer
          writeOnly: true
          description: Company who is selling the Product
        brand_id:
          type: integer
          writeOnly: true
          description: Brand ID for the product
        product_line_id:
          type: integer
          writeOnly: true
          description: Product Line ID of product
        name:
          type: string
          minLength: 1
          title: Product
          description: Product Name
          maxLength: 400
        license_id:
          type:
          - integer
          - 'null'
          writeOnly: true
          description: License ID for the product
        category_id:
          type: integer
          writeOnly: true
          description: Product category ID for the product
        sub_category_id:
          type: integer
          writeOnly: true
          description: Product sub-category ID for the product
        unit_of_measure_id:
          type: integer
          writeOnly: true
          description: Base unit of measure ID for this product
        unit_denomination_id:
          type: integer
          writeOnly: true
          description: The ID of amount of individual products in one sale unit
        listing_state:
          allOf:
          - $ref: '#/components/schemas/ListingStateEnum'
          description: Product listing state. Values available at the /listing-states/ endpoint.
        description:
          type: string
          minLength: 1
          description: Brand Description
          maxLength: 7000
        wholesale_price:
          type: object
          properties:
            amount:
              type: number
            currency:
              type: string
          description: Wholesale price displayed in the LeafLink marketplace
        retail_price:
          type: object
          properties:
            amount:
              type: number
            currency:
              type: string
          description: Retail price displayed in the LeafLink marketplace
        strains:
          type: array
          items:
            type: integer
            title: Strains of a product
          title: Strains of a product
          description: The cannabis strains associated with this product
        strain_classification:
          oneOf:
          - $ref: '#/components/schemas/StrainClassificationEnum'
          - $ref: '#/components/schemas/BlankEnum-unified-upstream-marketplace'
        is_medical_line_item:
          type: boolean
          description: Is this a medical line item?
        grow_type:
          description: The type of grow operation for the flower product
          oneOf:
          - $ref: '#/components/schemas/GrowTypeEnum'
          - $ref: '#/components/schemas/BlankEnum-unified-upstream-marketplace'
        base_units_per_unit:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,15})?$
          description: Number of base units in one unit of this product
        threshold:
          allOf:
          - $ref: '#/components/schemas/ThresholdRequest'
          description: Threshold configuration for inventory alerts
        product_specification_items:
          type: array
          items:
            $ref: '#/components/schemas/UnifiedProductSpecificationItemRequest'
        varieties:
          type: array
          items:
            $ref: '#/components/schemas/UnifiedSubProductMVPRequest'
    ListingStateEnum:
      enum:
      - Available
      - Archived
      - Sample
      - Backorder
      - Internal
      - Unavailable
      type: string
    UnifiedProductMVP:
      type: object
      description: Unified Product serializer.
      properties:
        id:
          type: integer
          readOnly: true
        created_date:
          type: string
          format: date-time
          readOnly: true
          description: Date and time the resource was created
        modified_date:
          type: string
          format: date-time
          readOnly: true
          description: Date and time of the last edit
        sku:
          type:
          - string
          - 'null'
          title: Customer SKU
          description: Stock Keeping Unit. A unique identifier for a Product, alternative to id.
          maxLength: 255
        seller:
          allOf:
          - $ref: '#/components/schemas/UnifiedCompany'
          readOnly: true
          description: Seller of the product
        brand:
          allOf:
          - $ref: '#/components/schemas/UnifiedBrand'
          readOnly: true
          description: Brand of the product
        product_line:
          type:
          - integer
          - 'null'
          readOnly: true
          description: Product Line of product
        name:
          type: string
          title: Product
          description: Product Name
          maxLength: 400
        display_name:
          type: string
          readOnly: true
          description: product name that is displayed
        license:
          allOf:
          - $ref: '#/components/schemas/ComplianceLicense'
          readOnly: true
          description: License for the product
        category:
          allOf:
          - $ref: '#/components/schemas/UnifiedProductCategory'
          readOnly: true
          description: Product category for the product
        sub_category:
          type:
          - integer
          - 'null'
          readOnly: true
          description: The sub-category of the Product (e.g. Bulk Flower, Live Resin, etc)
        unit_of_measure:
          allOf:
          - $ref: '#/components/schemas/UnifiedUnitOfMeasure'
          readOnly: true
          description: Base unit of measure for this product
        unit_denomination:
          allOf:
          - $ref: '#/components/schemas/UnifiedUnitDenomination'
          readOnly: true
          description: The of amount of individual products in one sale unit
        listing_state:
          allOf:
          - $ref: '#/components/schemas/ListingStateEnum'
          description: Product listing state. Values available at the /listing-states/ endpoint.
        description:
          type: string
          description: Brand Description
          maxLength: 7000
        wholesale_price:
          type: object
          properties:
            amount:
              type: number
