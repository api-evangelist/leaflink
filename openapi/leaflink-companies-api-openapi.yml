openapi: 3.2.0
info:
  title: LeafLink Marketplace V2 Companies API
  description: '# Introduction

    ## HTTP Request Notes

    All endpoints covered in this document are preceded by `https://{{domain}}/api/v2/` unless otherwise noted.


    Available domains


    - `app.leaflink.com` - production environment


    - `www.sandbox.leaflink.com` - sandbox environment


    - `www.leaflink-integrations.leaflink.com` - integrations sandbox environment


    [Learn more about sandbox environments](https://developer.leaflink.com/brands/api/authorization/#sandbox-environments)



    Request paths must end in a slash character (''/''). Those that do not will return a 400 (Bad Request) response.


    ## Dynamic Responses

    Some of our API endpoints support dynamic responses. These

    are responses that vary in content and/or object level payload size

    according to request path or query parameters.


    Available parameters are listed beneath endpoint definitions.

    '
  termsOfService: https://leaflink.com/terms-and-conditions/
  contact:
    email: support@leaflink.com
  version: ''
servers:
- url: https://app.leaflink.com/api/v2
security:
- Token: []
tags:
- name: companies
paths:
  /companies/:
    parameters: []
    get:
      operationId: companies_list
      summary: List companies
      description: List companies the requesting user is a staff member of.
      parameters:
      - name: limit
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        description: The initial index from which to return the results.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompanyResponse'
      tags:
      - companies
  /companies/{id}/:
    parameters:
    - name: id
      in: path
      description: The id for the company.
      required: true
      schema:
        type: integer
    get:
      operationId: companies_read
      summary: Retrieve a company
      description: Retrieve an individual company.
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
      tags:
      - companies
components:
  schemas:
    CompanyResponse:
      type: object
      properties:
        address:
          type: string
        announcement:
          type: string
        apply_ancillary_tax:
          type: boolean
        apply_arms_length_tax:
          type: boolean
        batch_enabled:
          title: Batch enabled
          type: boolean
          description: Is the batches feature enabled?
        business_identifier:
          description: Business identifier (Only applicable to WA)
          type: string
        business_license_name:
          type: string
        buyer:
          description: Does the company buy on the LeafLink marketplace?
          type: boolean
        seller:
          description: Does the company sell on the LeafLink marketplace?
          type: boolean
        city:
          type: string
        dba:
          type: string
        description:
          type: string
        has_accting:
          description: Is the QuickBooks Online integration enabled?
          type: boolean
        hide_attached_packages:
          description: Metrc integration setting
          type: boolean
        id:
          description: Unique id generated by LeafLink.
          type: integer
        image:
          type: string
          format: uri
        name:
          type: string
        slug:
          type: string
          format: slug
        state:
          type: string
        sts_enabled:
          description: Is the Metrc integration enabled?
          type: boolean
        zipcode:
          type: string
  securitySchemes:
    Token:
      description: 'You must authenticate your requests by including your API key in each request header as described below.


        Requests should include a header named `Authorization`, with the value `App {MY_API_KEY}`. Note the single space in the header value.


        Example: `Authorization: App MY_API_KEY`


        [Learn more about generating your key](https://developer.leaflink.com/brands/api/getting-started/)


        **Legacy API keys:** If you are not using an Application API key, your authorization header should include the string `Token` and access will be scoped to all companies under which the user exists as a companystaff.


        Example: `Authorization: Token MY_API_KEY`

        '
      in: header
      name: Authorization
      type: apiKey
