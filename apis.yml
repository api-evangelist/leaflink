- aid: leaflink:marketplace-v2
  name: LeafLink Marketplace V2 API
  description: 'The legacy LeafLink Marketplace V2 REST API, currently at release 2.39.0. 66 paths and 111 operations
    for brands and retailers: orders received, buyer orders, line items, order payments and event logs, products
    and product batches, customers, customer statuses and tiers, credits, licenses, retailer inventory, strains,
    reports and promo codes. Token/App-key auth, limit/offset paging, dynamic responses via include_children and
    fields_include/fields_exclude.'
  humanURL: https://developer.leaflink.com/legacy/v2/api/getting-started/
  baseURL: https://app.leaflink.com/api/v2
