aid: leaflink
name: LeafLink
description: LeafLink is the wholesale cannabis marketplace and B2B commerce platform connecting licensed cannabis
  brands, distributors and retailers across roughly 30 US markets. The platform bundles a wholesale marketplace,
  order management, payments and net terms (LeafLink Financial), logistics and transportation, inventory management,
  seed-to-sale traceability integration, compliance and licensing, advertising and market insights into one system
  of record for regulated cannabis wholesale. LeafLink publishes a public REST API at api.leaflink.com — the current
  dated version 2022-10-31, authenticated with JWT bearer tokens, spanning 182 paths and 269 operations across products,
  orders, customers, inventory, payments, logistics, traceability, compliance, taxes and messaging — alongside a
  legacy Marketplace V2 API at app.leaflink.com/api/v2 with 66 paths and 111 operations. Both are documented with
  OpenAPI on the LeafLink Developer Hub, and the platform supports HMAC-signed webhooks for order and product events.
deliveryModel:
