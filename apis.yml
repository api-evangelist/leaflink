- aid: leaflink:api
  name: LeafLink API
  description: The current LeafLink REST API, version 2022-10-31. 182 paths and 269 operations covering products
    and catalog, customers, brands, inventory (CQRS commands + measurement queries), payments and invoices, logistics
    and transportation, traceability, compliance and licensing, taxes, pricing and chats. JSON only, snake_case,
    JWT bearer auth, date-versioned via the LeafLink-Version header.
